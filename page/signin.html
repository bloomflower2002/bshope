<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign In | Bshope</title>
        <link rel="stylesheet" href="../style/signin.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
        <style>
           
        </style>
    </head>
    <body>
 <div class="signin-brand">
                    <a href="index.html">
                        <img src="../image/bshopewhite.png" alt="Bshope Logo" class="signin-logo">
                    </a>
                </div>
                
        <section class="signin-page">
            <div class="signin-card">
                
                <h2>Sign in to Bshope</h2>
                <p>Use your account to access auctions, track bids, and manage your membership.</p>
                <form class="signin-form" action="#" method="post">
                    <div>
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="signin-submit">Sign In</button>
                </form>
                <div class="signin-footer">
                    Don’t have an account? <a href="product.html">Create one now</a>
                </div>
            </div>
        </section>

        <section class="footer">
            <div class="footer-links">
                <a href="terms.html">Terms of Service</a> | <a href="privacy.html">Privacy Policy</a> | <a href="contact.html">Contact Us</a>
            </div>
            <div class="signin-footer">
                <p>&copy; 2026 Bshope. All rights reserved.</p>
            </div>
        </section>

    </body>
</html>
